<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PondoSync - Financial Transparency System for JPCS BatStateU Lipa">
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="PondoSync — JPCS Finance">
  <meta property="og:description" content="Financial Transparency System for JPCS BatStateU Lipa">
  <meta property="og:image" content="https://pondo-sync.vercel.app/assets/images/screenshot.png">
  <meta property="og:url" content="https://pondo-sync.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PondoSync — JPCS Finance">
  <meta name="twitter:description" content="Financial Transparency System for JPCS BatStateU Lipa">
  <meta name="twitter:image" content="https://pondo-sync.vercel.app/assets/images/screenshot.png">

  <title>PondoSync — Login</title>
  <link rel="icon" type="image/png" href="assets/logos/web-icon.png">
  <script>
    (function() {
      try {
        if (localStorage.getItem('pondosync_perf_mode') === 'true') {
          document.documentElement.classList.add('performance-mode');
        }
      } catch(e) {}
    })();
  </script>
  <script src="js/performance-manager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Three.js for 3D background logo -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/landing.css?v=2.0">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
      border-radius: 50%;
      animation: floatSlow 15s ease-in-out infinite;
    }
    .login-wrapper::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(92,64,51,0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: floatSlow 20s ease-in-out infinite reverse;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }

    .login-container {
      position: relative;
      z-index: 2;
      display: flex;
      width: 900px;
      max-width: 95vw;
      min-height: 540px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card), 0 0 60px rgba(212,175,55,0.06);
      animation: fadeInUp 0.6s ease-out;
    }

    .login-brand {
      flex: 1;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl);
      position: relative;
      overflow: hidden;
    }

    .login-brand::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(212,175,55,0.03) 50%, transparent 100%);
    }

    .login-brand .brand-logos {
      display: flex;
      gap: var(--space-md);
      align-items: center;
      margin-bottom: var(--space-xl);
      position: relative;
    }

    .login-brand .brand-logos img {
      width: 64px;
      height: 64px;
      box-shadow: var(--shadow-card), 0 0 60px rgb(212 100 55 / 6%);
      border-radius: 50%;
      object-fit: cover;
    }

    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-light) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-sm);
      position: relative;
    }

    .login-brand p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
      max-width: 260px;
    }

    .login-brand .brand-divider {
      width: 300px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: var(--space-md) 0;
    }

    .login-brand .brand-tagline {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--gold-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-form-panel {
      flex: 1;
      background: var(--glass-gold-bg);
      backdrop-filter: var(--glass-gold-blur);
      padding: var(--space-2xl) var(--space-xl);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-form-panel h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
    }

    .login-form-panel .subtitle {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: var(--space-xl);
    }

    .form-group { margin-bottom: var(--space-md); }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--space-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: var(--font-primary);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
    }

    .form-group input::placeholder { color: rgba(160,160,160,0.5); }

    /* Password Toggle */
    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .password-toggle:hover { color: var(--gold); }
    .password-toggle svg { width: 18px; height: 18px; }

    /* Suggestion Ghost */
    .suggestion-ghost {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgba(255, 255, 255, 0.15);
      font-family: var(--font-primary);
      font-size: 0.95rem;
      white-space: pre;
      z-index: 1;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      background-size: 200% 100%;
      color: #0F0F0F;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: var(--space-md);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-login:hover {
      background-position: 100% 0;
      box-shadow: 0 4px 20px rgba(212,175,55,0.3);
      transform: translateY(-1px);
    }

    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .form-toggle {
      text-align: center;
      margin-top: var(--space-lg);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .form-toggle a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .form-toggle a:hover { color: var(--gold-light); }

    .login-error {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      color: #ff6b7a;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: var(--space-md);
      display: none;
    }

    .login-error.show { display: block; animation: fadeIn 0.3s ease; }
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: var(--font-primary);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
      box-sizing: border-box;
      cursor: pointer;
    }

    .form-group select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.1); }

    /* ---------- 3D Background Canvas ---------- */
    .login-3d-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: screen; /* Makes black transparent, keeps bloom bright */
    }

    .login-3d-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .login-container { flex-direction: column; min-height: auto; }
      .login-brand { padding: var(--space-xl); }
      .login-brand h1 { font-size: 1.6rem; }
    }

    @keyframes pulseLoading {
      0%, 100% { opacity: 0.85; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen Overlay removed for modern skeleton/progressive load system -->

  <div class="login-wrapper">
    <!-- Performance Mode Toggle for Login & Landing -->
    <div class="login-perf-wrapper">
      <button type="button" class="topbar-action-btn perf-toggle-btn" id="perf-toggle-btn" role="switch" aria-checked="false" aria-label="Performance Mode">
        <i data-lucide="gauge" class="perf-toggle-icon"></i>
      </button>
    </div>

    <!-- Return to Landing Page Button (Visible on Login View) -->
    <button type="button" class="login-back-btn" id="btn-back-to-landing" aria-label="Back to Home">
      <i data-lucide="arrow-left"></i>
      <span>Back</span>
    </button>

    <!-- 3D Philippine 20-Peso Coin Canvas -->
    <div class="login-3d-container" id="login-3d-container">
      <canvas id="login-3d-canvas"></canvas>
    </div>

    <!-- ── Minimalist Landing Page Screen ── -->
    <section class="landing-screen" id="landing-screen">
      <!-- Centered Introduction Hero -->
      <div class="landing-hero">
        <!-- Dual Logos Badge (BSU & JPCS) -->
        <div class="landing-logos-badge">
          <img src="assets/logos/bsu-logo.png" alt="Batangas State University" class="landing-badge-img">
          <img src="assets/logos/jpcs-logo.png" alt="Junior Philippine Computer Society" class="landing-badge-img">
        </div>

        <!-- Heading -->
        <h1 class="landing-title">
          Financial Transparency,<br>
          <span class="landing-title-accent">Made Simple.</span>
        </h1>

        <!-- Description -->
        <p class="landing-desc">
          Manage organizational funds, track financial activity, and understand where every peso goes with PondoSync.
        </p>

        <!-- Single Primary Action Button -->
        <button type="button" class="btn-get-started" id="btn-get-started">
          <span>Get Started</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </section>

    <!-- ── Existing Login Card ── -->
    <div class="login-container initial-hidden" id="login-container">
      <div class="login-brand">
        <div class="brand-logos">
          <img src="assets/logos/bsu-logo.png" alt="BatStateU" onerror="this.style.display='none'">
          <img src="assets/logos/jpcs-logo.png" alt="JPCS" onerror="this.style.display='none'">
        </div>
        <h1>PondoSync</h1>
        <p>Financial Transparency System for the Junior Philippine Computer Society</p>
        <div class="brand-divider"></div>
        <span class="brand-tagline">BatStateU Lipa</span>
      </div>

      <div class="login-form-panel">
        <h2 id="form-title">Welcome Back</h2>
        <p class="subtitle" id="form-subtitle">Sign in to access the dashboard</p>

        <div class="login-error" id="login-error"></div>

        <form id="auth-form" autocomplete="off" novalidate>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <span id="email-suggestion" class="suggestion-ghost"></span>
              <input type="email" id="email" placeholder="sr-code@g.batstate-u.edu.ph" required>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="••••••••" required minlength="6">
              <button type="button" class="password-toggle" id="password-toggle" title="Toggle visibility">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="btn-submit">Sign In</button>
        </form>


    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/cursor-glow.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    let isLogin = true;

    // Password Toggle Logic
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordToggle.innerHTML = isPassword ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
      lucide.createIcons();
    });

    // Email Suggestion Logic
    const emailInput = document.getElementById('email');
    const emailSuggestion = document.getElementById('email-suggestion');
    const suffix = '@g.batstate-u.edu.ph';

    emailInput.addEventListener('input', () => {
      const val = emailInput.value;
      // Pattern: XX-XXXXX (e.g., 21-12345)
      const srCodeRegex = /^\d{2}-\d{5}$/;
      
      if (srCodeRegex.test(val)) {
        emailSuggestion.textContent = val + suffix;
      } else if (val.includes(suffix.split('@')[1]) || (val.includes('@') && val.length > 8)) {
        // If they start typing the suffix or have an @
        if (suffix.startsWith(val.substring(val.indexOf('@')))) {
           emailSuggestion.textContent = val.substring(0, val.indexOf('@')) + suffix;
        } else {
           emailSuggestion.textContent = '';
        }
      } else {
        emailSuggestion.textContent = '';
      }
      
      // Clear suggestion if they type exactly the whole thing or more
      if (val === emailSuggestion.textContent) {
        emailSuggestion.textContent = '';
      }
    });

    // Email Autocomplete on Tab/Enter
    emailInput.addEventListener('keydown', (e) => {
      if ((e.key === 'Tab' || e.key === 'Enter') && emailSuggestion.textContent) {
        e.preventDefault();
        emailInput.value = emailSuggestion.textContent;
        emailSuggestion.textContent = '';
        passwordInput.focus();
      }
    });


    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const errorEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorEl.classList.remove('show');

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const url = `${window.API_URL || 'http://localhost:10000/api'}/auth/login`;
        const body = { email, password };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!data.success) {
          throw new Error(data.message || data.errors?.[0]?.msg || 'Authentication failed.');
        }

        localStorage.setItem('bb_token', data.token);
        localStorage.setItem('bb_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    if (localStorage.getItem('bb_token')) {
      window.location.href = '/dashboard.html';
    }

    // ── Transition Between Landing Page and Login Card ──
    let currentView = 'landing';

    function transitionToLogin(instant = false) {
      if (currentView === 'login') return;
      currentView = 'login';

      const landingScreen = document.getElementById('landing-screen');
      const loginContainer = document.getElementById('login-container');
      const loginBackBtn = document.getElementById('btn-back-to-landing');

      if (!instant) {
        try { history.pushState({ view: 'login' }, '', '#login'); } catch (e) {}
      }

      // Signal 3D scene to transition to login view
      window.dispatchEvent(new CustomEvent('pondo-coin-exit'));
      window.dispatchEvent(new CustomEvent('pondo-view-login'));

      if (instant) {
        if (landingScreen) landingScreen.style.display = 'none';
        if (loginContainer) {
          loginContainer.classList.remove('initial-hidden', 'transition-enter-prepare', 'transition-exit-active');
          loginContainer.classList.add('transition-enter-active');
          loginContainer.style.display = 'flex';
        }
        if (loginBackBtn) loginBackBtn.classList.add('visible');
        const emailInput = document.getElementById('email');
        if (emailInput) emailInput.focus();
        return;
      }

      // Phase 1: Landing UI floats up and fades
      if (landingScreen) {
        landingScreen.classList.add('exiting');
        landingScreen.classList.remove('entering');
      }

      // Prepare login container: make visible, distant (scale 0.92) & transparent
      if (loginContainer) {
        loginContainer.classList.remove('initial-hidden', 'transition-exit-active');
        loginContainer.classList.add('transition-enter-prepare');
        loginContainer.style.display = 'flex';
      }

      // Show back button
      if (loginBackBtn) loginBackBtn.classList.add('visible');

      // Force layout reflow
      void (loginContainer && loginContainer.offsetWidth);

      // Phase 2: Scale from distant to full size and fade in smoothly
      setTimeout(() => {
        if (loginContainer) {
          loginContainer.classList.remove('transition-enter-prepare');
          loginContainer.classList.add('transition-enter-active');
        }
      }, 140);

      // Phase 3: Transition complete
      setTimeout(() => {
        if (landingScreen) landingScreen.style.display = 'none';
        const emailInput = document.getElementById('email');
        if (emailInput) emailInput.focus();
      }, 800);
    }

    function transitionToLanding(instant = false) {
      if (currentView === 'landing') return;
      currentView = 'landing';

      const landingScreen = document.getElementById('landing-screen');
      const loginContainer = document.getElementById('login-container');
      const loginBackBtn = document.getElementById('btn-back-to-landing');

      try { history.pushState({ view: 'landing' }, '', window.location.pathname); } catch (e) {}

      // Signal 3D scene to transition back to landing view
      window.dispatchEvent(new CustomEvent('pondo-coin-enter'));
      window.dispatchEvent(new CustomEvent('pondo-view-landing'));

      // Hide back button
      if (loginBackBtn) loginBackBtn.classList.remove('visible');

      if (instant) {
        if (loginContainer) {
          loginContainer.classList.add('initial-hidden');
          loginContainer.classList.remove('transition-enter-active', 'transition-enter-prepare');
          loginContainer.style.display = 'none';
        }
        if (landingScreen) {
          landingScreen.style.display = 'flex';
          landingScreen.classList.remove('exiting', 'entering');
        }
        return;
      }

      // Phase 1: Login card scales down and fades out
      if (loginContainer) {
        loginContainer.classList.remove('transition-enter-active');
        loginContainer.classList.add('transition-exit-active');
      }

      // Prepare landing screen to fade in
      if (landingScreen) {
        landingScreen.style.display = 'flex';
        landingScreen.classList.remove('exiting');
        landingScreen.classList.add('entering');
      }

      // Force layout reflow
      void (landingScreen && landingScreen.offsetWidth);

      // Phase 2: Fade in landing elements
      setTimeout(() => {
        if (landingScreen) landingScreen.classList.remove('entering');
      }, 100);

      // Phase 3: Complete
      setTimeout(() => {
        if (loginContainer) {
          loginContainer.classList.add('initial-hidden');
          loginContainer.classList.remove('transition-exit-active');
          loginContainer.style.display = 'none';
        }
      }, 800);
    }

    // Attach click events to Get Started button
    document.getElementById('btn-get-started')?.addEventListener('click', () => transitionToLogin());
    document.getElementById('btn-back-to-landing')?.addEventListener('click', () => transitionToLanding());

    // Allow clicking brand on login card to return to landing
    document.querySelector('.login-brand')?.addEventListener('click', (e) => {
      if (e.target.closest('.brand-logos') || e.target.closest('h1')) {
        transitionToLanding();
      }
    });

    // Check initial hash route
    if (window.location.hash === '#login') {
      transitionToLogin(true);
    }

    // Support browser back/forward buttons
    window.addEventListener('popstate', () => {
      if (window.location.hash === '#login') {
        transitionToLogin(false);
      } else {
        transitionToLanding(false);
      }
    });

    // Loading Screen logic removed for modern skeleton/progressive load system


  </script>

  <!-- 3D Background Logo Script -->
  <script type="module" src="js/login-3d.js?v=2.2"></script>

  <!-- Dust Particle Physics System -->
  <script src="js/dust-particles.js"></script>
</body>
</html>
